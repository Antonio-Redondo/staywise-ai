version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      langchain:
        patterns:
          - "@langchain/*"
          - "@langgraphjs/*"
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
          - "assistant-ui"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      types:
        patterns:
          - "@types/*"
      lint-format:
        patterns:
          - "eslint*"
          - "prettier"
          - "@typescript-eslint/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@playwright/*"
          - "playwright"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(actions)"
