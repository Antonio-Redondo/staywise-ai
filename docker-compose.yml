version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-staywise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staywise}
      POSTGRES_DB: ${POSTGRES_DB:-staywise}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-"postgresql://staywise:staywise@db:5432/staywise"}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-placeholder}
      REAL_ESTATE_API_KEY: ${REAL_ESTATE_API_KEY:-placeholder}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app:cached
    command: sh -c "python -m app.db.init_db || true && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db_data:
    name: staywise_db_data
